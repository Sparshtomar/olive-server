# Publishes @sparshtomar/olive-shared when a `shared-v<version>` tag is pushed.
# The app depends on the published version, so contract changes are explicit, versioned releases.
name: Release shared package

on:
  push:
    tags: ['shared-v*']

permissions:
  contents: read
  # Signs the package with npm provenance, linking each release to this repo and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: |
          version=$(node -p "require('./packages/shared/package.json').version")
          test "$GITHUB_REF_NAME" = "shared-v$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: npm test -w @sparshtomar/olive-shared
      - run: npm publish -w @sparshtomar/olive-shared --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
